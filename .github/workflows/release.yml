# Erstellt ein Release, sobald ein Tag wie v0.7.0 hochgeladen wird:
#   git tag v0.7.0
#   git push origin v0.7.0
# Das Release enthält ItenAmbilight.exe (eine einzelne Datei, läuft ohne installiertes .NET)
# und die Firmware. Das Programm sucht beim Start nach genau dieser Datei.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version aus dem Tag lesen
        id: version
        shell: bash
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Programm bauen
        run: >
          dotnet publish src/ItenAmbilight/ItenAmbilight.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -p:Version=${{ steps.version.outputs.number }} -o publish

      - name: Firmware packen
        shell: pwsh
        run: Compress-Archive -Path firmware/* -DestinationPath publish/firmware.zip

      - name: Release erstellen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" publish/ItenAmbilight.exe publish/firmware.zip --title "IT-EN Ambilight $GITHUB_REF_NAME" --generate-notes
